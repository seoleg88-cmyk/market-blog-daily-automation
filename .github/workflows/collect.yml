name: Collect Market Data

on:
  schedule:
    - cron: '50 20 * * *'   # UTC 20:50 = 한국시간 05:50
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        run: |
          python collector.py

      - name: Validate market data
        run: |
          python validator.py

      - name: Commit market data
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add market_data.json
          git diff --staged --quiet || git commit -m "market data $(date -u +%Y-%m-%dT%H:%M)"
          git push
